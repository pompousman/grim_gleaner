name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test the public automation contract
        shell: bash
        run: |
          grim-gleaner profile-schema --output generated-profile.schema.json >/dev/null
          cmp generated-profile.schema.json schemas/profile.schema.json
          grim-gleaner profile-context \
            --catalog-root artifacts/catalog \
            --mastery playerclass05 \
            --mastery playerclass08 \
            --output generated-context.json >/dev/null
          grim-gleaner rank-profile \
            --catalog-root artifacts/catalog \
            --profile-file artifacts/profiles/examples/Lightning_Vindicator.json \
            --kind affix --slot ring --limit-per-slot 2 \
            --output generated-ranking.json >/dev/null
          python - <<'EOF'
          import json
          payload = json.load(open("generated-ranking.json", encoding="utf-8"))
          assert payload["protocol"] == "grim-gleaner-profile-ranking"
          ring = payload["slots"]["ring"]
          assert ring["prefixes"] and ring["suffixes"]
          assert ring["prefixes"][0]["matched_stats"]
          EOF
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            > mcp-input.jsonl
          grim-gleaner serve-mcp --catalog-root artifacts/catalog < mcp-input.jsonl > mcp-output.jsonl
          python - <<'EOF'
          import json
          responses = [json.loads(line) for line in open("mcp-output.jsonl", encoding="utf-8")]
          assert len(responses) == 2, "notification must not produce a response"
          initialize, tools = responses
          assert initialize["result"]["serverInfo"]["name"] == "grim-gleaner"
          names = {tool["name"] for tool in tools["result"]["tools"]}
          assert "rank_profile" in names and "get_profile_context" in names
          EOF
