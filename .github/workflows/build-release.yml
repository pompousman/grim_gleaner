name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.9.2-beta"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-build\Scripts\python.exe -m pip install -e ".[test,release]"

      - name: Build Windows package
        shell: pwsh
        run: |
          powershell.exe `
            -ExecutionPolicy Bypass `
            -File .\scripts\package-release.ps1 `
            -BuildPython "$PWD\.venv-build\Scripts\python.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grim-Gleaner-Windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Grim Gleaner ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          files: dist/*.zip
